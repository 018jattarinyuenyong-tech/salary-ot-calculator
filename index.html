<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Salary & OT Calculator V6.0</title><style>:root{--bg:#080b14;--card:#121827;--cyan:#00e5ff;--pink:#ff3ea5;--text:#f8fafc;--muted:#aab5c7}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#24345e 0,#080b14 48%,#03050a 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}main{width:min(560px,100%);text-align:center;background:rgba(18,24,39,.96);border:1px solid #00e5ff55;border-radius:24px;padding:28px;box-shadow:0 18px 60px #0008}.logo{width:88px;height:88px;margin:auto auto 14px;border-radius:20px;display:grid;place-items:center;font-weight:900;font-size:28px;background:#151d32;border:2px solid var(--cyan);box-shadow:0 0 26px #00e5ff33}h1{margin:0 0 8px;font-size:28px}p{color:var(--muted);line-height:1.6}a,button{border:0;border-radius:14px;padding:14px 20px;margin:6px;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}.open{background:linear-gradient(135deg,var(--cyan),#68efff);color:#041016}#install{display:none;background:linear-gradient(135deg,var(--pink),#ff80c5);color:white}.qr{display:block;width:230px;height:230px;margin:18px auto 12px;background:white;padding:12px;border-radius:18px}.url{font-size:12px;word-break:break-all}small{color:var(--muted)}</style></head><body><main><div class="logo">OT</div><h1>Salary & OT Calculator</h1><p>V6.0 Production • Holiday OT time split fix<br>เงินเดือน • OT • สวัสดิการ • ปฏิทิน</p><a class="open" href="./app.html">🚀 เปิดโปรแกรม</a><button id="install">📲 ติดตั้งแอป</button><img class="qr" src="./qr-code.png" alt="QR Code"><div class="url">https://018jattarinyuenyong-tech.github.io/salary-ot-calculator/</div><p><small>สแกน QR Code เพื่อเปิดใช้งาน หรือกดติดตั้งแอปเมื่อเบราว์เซอร์รองรับ PWA</small></p></main><script>let deferredPrompt=null;const b=document.getElementById('install');addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;b.style.display='inline-block'});b.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;b.style.display='none'};addEventListener('appinstalled',()=>b.style.display='none');</script></body></html>
