<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087fba">
<title>Salary &amp; OT Calculator V6.3.0</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:linear-gradient(145deg,#eaf8ff,#e5fbf5);color:#173d60;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
main{width:min(100%,520px);background:#ffffffed;border:1px solid #cfe5f0;border-radius:28px;padding:26px 22px;text-align:center;box-shadow:0 14px 36px #174e7218}
h1{font-size:clamp(24px,6vw,32px);margin:0 0 8px}p{line-height:1.6;color:#4b6880}
.logo{width:76px;height:76px;object-fit:contain;margin:0 auto 12px}
a,button{display:block;width:100%;border:0;border-radius:16px;padding:16px 14px;margin:12px 0;font:inherit;font-size:18px;text-decoration:none;cursor:pointer}
.primary{background:linear-gradient(110deg,#087ee8,#08b7c9);color:white}
.secondary{background:white;border:2px solid #cfe0ed;color:#245e91}
.qr{width:min(76vw,260px);height:auto;border:1px solid #d8e5ed;border-radius:14px;padding:8px;background:white;margin:8px auto}
.small{font-size:14px;overflow-wrap:anywhere}
</style></head>
<body><main>
<img class="logo" src="./icon-192.png" alt="Salary & OT Calculator">
<h1>Salary &amp; OT Calculator V6.3.0</h1>
<p>โปรแกรมคำนวณเงินเดือน • OT • สวัสดิการ</p>
<a class="primary" href="./app.html">เปิดโปรแกรม</a>
<button class="secondary" id="installBtn" hidden>ติดตั้งโปรแกรม</button>
<p id="installNote" class="small">หากไม่เห็นปุ่มติดตั้ง ให้เปิดเมนูของเบราว์เซอร์แล้วเลือก “ติดตั้งแอป” หรือ “เพิ่มไปยังหน้าจอหลัก”</p>
<hr style="border:0;border-top:1px solid #d7e8ef;margin:22px 0">
<h2>QR Code สำหรับเปิดเว็บไซต์</h2>
<img class="qr" src="./qr-code.png" alt="QR Code เปิด Salary & OT Calculator">
<p class="small">สแกน QR Code ด้วยโทรศัพท์เพื่อเปิดเว็บไซต์</p>
<a class="secondary" href="https://018jattarinyuenyong-tech.github.io/salary-ot-calculator/" target="_blank" rel="noopener">เปิดเว็บไซต์ GitHub Pages</a>
</main>
<script>
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=document.getElementById('installBtn');b.hidden=false;});
document.getElementById('installBtn').addEventListener('click',async()=>{if(!installPrompt) return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').hidden=true;});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
